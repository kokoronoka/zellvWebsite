<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="section section-sand" style="padding-bottom: var(--space-xl)">
      <div class="container product-buy">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li><a href="index.html">Home</a></li><li><a href="products/index.html">Products</a></li><li><span aria-current="page">Cart</span></li></ol></nav>
        <h1 style="font-size: var(--fs-h1)">Your Cart</h1>
      </div>
    </section>
    <section class="section" style="padding-top: var(--space-xl)" data-cart-page aria-label="Cart contents">
      <div class="container cart-layout">
        <div class="cart-panel" data-cart-lines></div>
        <aside class="cart-aside" aria-labelledby="summary-title">
          <div class="cart-panel">
            <h2 id="summary-title">Order Summary</h2>
            <div data-cart-summary></div>

              <div id="paypal-buttons"></div>
              <p class="checkout-status" data-checkout-status role="alert"></p>

            </div>
          </div>
          <p style="margin-top: var(--space-md); font-size: 0.875rem">Need help with your order? <a href="https://wa.me/6593822879" target="_blank" rel="noopener" style="text-decoration: underline">WhatsApp us</a> or email <a href="mailto:enquiry@zell-v.com" style="text-decoration: underline">enquiry@zell-v.com</a>.</p>
